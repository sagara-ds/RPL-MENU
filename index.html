<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPL.menu</title>
    <link rel="icon" type="image/x-icon" href="assets/image/RPL_LOGO2.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="#"><img class="navbar-logo" src="assets/image/RPL_LOGO2.png" alt="RPL Logo"></a>

        <div class="navbar-nav">
            <a href="#">home</a>
            <a href="#" id="menu">menu</a>
            <a href="about.html">about</a>
        </div>

        <div class="navbar-extra">
            <button class="cart-toggle" type="button"><i data-feather="shopping-cart"></i></button>
            <a href="#" id="home" title="home"><i data-feather="home"></i></a>
            <button class="theme-switch" title="switch mode">
                <i data-feather="sun" id="light"></i>
                <i data-feather="moon" id="dark"></i>
            </button>
            <a href="about.html" id="about" title="about"><i data-feather="alert-circle"></i></a>
            <a href="#" id="hamburger-menu" title="menu"><i data-feather="menu"></i></a>
        </div>
    </nav>
    <section class="product">
        <h1>-DAY 1-</h1>
        <div class="row" id="menu-container">
        </div>
    </section>
    <aside class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h2>Keranjang</h2>
            <button class="cart-close" type="button">×</button>
        </div>
        <div id="cart-items" class="cart-items">
            <p class="cart-empty">Belum ada item di keranjang.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">Total: IDR 0</div>
            <button id="reset-cart-btn" type="button">Reset</button>
            <button class="checkout-btn" type="button">Check-out</button>
            <button id="print-receipt-btn" class="print-receipt-btn" type="button" hidden>Cetak Struk</button>
        </div>
    </aside>
    <div id="checkout-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Data Pemesan</h2>
            <form id="checkout-form">
                <div class="input-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" required placeholder="masukkan nama">
                </div>
                <div class="input-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" required placeholder="lokasi anda (contoh: 'XI AKL2')">
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="emailkamu67@gmail.com">
                </div>
                <div class="input-group">
                    <label for="catatan">Catatan</label>
                    <textarea id="catatan" rows="4" placeholder="catatan..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="btn-batal" class="btn-cancel">Batal</button>
                    <button type="submit" id="btn-konfirmasi" class="btn-confirm">Konfirmasi</button>
                </div>
            </form>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/lightmode.js"></script>

    <script>
        feather.replace();
    </script>
</body>

</html>
